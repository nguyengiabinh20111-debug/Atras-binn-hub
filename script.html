        * {

            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f111a;
            color: #ffffff;
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 24px;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0,255,204,0.4);
        }
        header p {
            font-size: 13px;
            color: #8b9bb4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .script-card {
            background: linear-gradient(145deg, #181b28, #131520);
            border: 1px solid #232738;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, border-color 0.2s;
        }
        .script-card:hover {
            border-color: #00ffcc;
            transform: translateY(-2px);
        }
        .script-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffcc00;
            margin-bottom: 10px;
            text-transform: capitalize;
        }
        .script-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aec0;
            margin-bottom: 10px;
            background: #12141d;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .vote-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }
        .vote-like { color: #2ecc71; }
        .vote-dislike { color: #e74c3c; }
        .code-box {
            background: #0b0c10;
            border: 1px solid #1f2430;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #00ffcc;
            word-break: break-all;
            max-height: 80px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .copy-btn {
            background: linear-gradient(135deg, #00ffcc, #00bfff);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,255,204,0.2);
        }
        .copy-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>

            card.innerHTML = `
                <div class="script-title">🎮 ${name}</div>
                <div class="script-info">
                    <span class="vote-badge vote-like">👍 Thích: ${data.likes}</span>
                    <span class="vote-badge vote-dislike">👎 Không thích: ${data.dislikes}</span>
                </div>
                <div class="code-box">${data.code}</div>
                <button class="copy-btn" onclick="copyCode(this, \`${data.code}\`)">📋 Copy Script</button>
            `;
            container.appendChild(card);
        }

        function copyCode(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = '✅ Đã Copy Thành Công!';
                btn.style.background = '#2ecc71';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = 'linear-gradient(135deg, #00ffcc, #00bfff)';
                    btn.style.color = '#000';
                }, 1500);
            });
