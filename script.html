        const itemsPerPage = 8;
        let currentPage = 1;
        const scriptKeys = Object.keys(scriptData);
        const totalPages = Math.ceil(scriptKeys.length / itemsPerPage);

        function renderPage(page) {
            currentPage = page;
            const container = document.getElementById('script-list');
            container.innerHTML = '';

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageKeys = scriptKeys.slice(start, end);

            pageKeys.forEach(name => {
                const data = scriptData[name];
                const card = document.createElement('div');
                card.className = 'script-card';
                
                card.innerHTML = `
                    <div class="script-title">🎮 ${name}</div>
                    <div class="script-info">
                        <span class="vote-badge vote-like">👍 Thích: ${data.likes}</span>
                        <span class="vote-badge vote-dislike">👎 Không thích: ${data.dislikes}</span>
                    </div>
                    <div class="code-box">${data.code}</div>
                    <button class="copy-btn" onclick="copyCode(this, \`${data.code}\`)">📋 Copy Script</button>
                `;
                container.appendChild(card);
            });

            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = `Trang ${i}`;
                btn.onclick = () => renderPage(i);
                paginationContainer.appendChild(btn);
            }
        }

        function copyCode(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = '✅ Đã Copy Thành Công!';
                btn.style.background = '#4ade80';
                btn.style.color = '#000';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = 'linear-gradient(135deg, #38bdf8, #2563eb)';
                    btn.style.color = '#fff';
                }, 1500);
            });
        }

        renderPage(1);
