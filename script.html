        .copy-btn {

        .copy-btn:hover { opacity: 0.9; }

        .page-btn {

        const itemsPerPage = 10; // Thay đổi thành 10 script mỗi trang
        const scriptKeys = Object.keys(scriptsData);
        let currentPage = 1;

        function renderPage(page) {
            currentPage = page;
            const container = document.getElementById('list-card-container');
            container.innerHTML = '';

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const currentItems = scriptKeys.slice(start, end);

            currentItems.forEach(name => {
                const item = scriptsData[name];
                const card = document.createElement('div');
                card.className = 'script-card';
                card.innerHTML = `
                    <div class="script-title">🎮 ${name}</div>
                    <div class="reaction-row"><span>👍 Thích: ${item.likes}</span><span>👎 Không thích: ${item.dislikes}</span></div>
                    <textarea readonly>${item.code}</textarea>
                    <button class="copy-btn" onclick="copyText(this)">Copy Script</button>
                `;
                container.appendChild(card);
            });

            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination-container');
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(scriptKeys.length / itemsPerPage);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => renderPage(i);
                paginationContainer.appendChild(btn);
            }
        }

        function copyText(button) {
            const textarea = button.previousElementSibling;
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            button.innerText = "Đã Copy Thành Công! ✅";
            setTimeout(() => { button.innerText = "Copy Script"; }, 2000);
        }

        renderPage(1);
