<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIN HUB - Đăng Nhập Key</title>
    <style>
        body { 
            background: #0b0f19; color: #fff; font-family: 'Poppins', sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
        }
        .auth-card { 
            background: #131b2e; padding: 30px; border-radius: 20px; text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid rgba(99, 102, 241, 0.3); max-width: 420px; width: 90%; 
        }
        .auth-card h1 { 
            background: linear-gradient(45deg, #6366f1, #a855f7); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; 
        }
        .auth-card p { color: #9ca3af; font-size: 0.85rem; margin-bottom: 20px; }
        .btn { 
            background: #5865F2; color: white; padding: 12px 20px; border-radius: 10px; 
            text-decoration: none; font-weight: bold; display: block; margin-bottom: 15px; 
            border: none; width: 100%; cursor: pointer; box-sizing: border-box; transition: 0.3s; 
        }
        .btn:hover { background: #4752c4; }
        .btn-key { background: #f59e0b; }
        .btn-key:hover { background: #d97706; }
        input { 
            width: 100%; padding: 12px; border-radius: 10px; background: #05070a; 
            border: 1px solid #1e293b; color: white; margin-bottom: 15px; 
            box-sizing: border-box; text-align: center; font-size: 1rem; 
        }
        .btn-submit { background: #10b981; color: white; border: none; cursor: pointer; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .btn-submit:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>BIN HUB SYSTEM</h1>
        <p>Nhập Key để mở khóa kho Script!</p>
        <input type="text" id="key-input" placeholder="Nhập Key của bạn vào đây...">
        <button class="btn btn-key" onclick="window.open('https://discord.gg/uqhEpzXy9q', '_blank')">Lấy Key Từ Bot Discord</button>
        <button class="btn-submit" onclick="checkKey()">Xác Nhận Key</button>
        <p id="error-msg" style="color: #ef4444; margin-top: 10px; display: none;">Sai Key rồi bạn ơi!</p>
    </div>

    <script>
        const validKeys = ["BIN-VIP-2026", "BACON-HUB-FREE", "BINHUB123"];

        function checkKey() {
            const userKey = document.getElementById('key-input').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (validKeys.includes(userKey)) {
                // Nhập đúng chuyển sang file script.html
                window.location.href = "script.html";
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
