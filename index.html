        function renderScripts(data) {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = '';

            for (const [name, info] of Object.entries(data)) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <h3>${name}</h3>
                        <div class="stats">
                            <span>👍 Thích: ${info.likes}</span>
                            <span>👎 Không thích: ${info.dislikes}</span>
                        </div>
                    </div>
                    <button class="btn-copy" onclick="copyCode(this, \`${info.code}\`)">📋 Copy Script</button>
                `;
                grid.appendChild(card);
            }
        }

        function filterScripts() {
            const keyword = document.getElementById('searchBox').value.toLowerCase();
            const filtered = {};
            for (const [name, info] of Object.entries(scriptsData)) {
                if (name.toLowerCase().includes(keyword)) {
                    filtered[name] = info;
                }
            }
            renderScripts(filtered);
        }

        function copyCode(btn, code) {
            navigator.clipboard.writeText(code).then(() => {
                btn.innerText = '✨ Đã Copy!';
                btn.classList.add('btn-copied');
                
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                
                setTimeout(() => {
                    btn.innerText = '📋 Copy Script';
                    btn.classList.remove('btn-copied');
                    toast.style.display = 'none';
                }, 1500);
            });
        }

        // Khởi chạy hiển thị ban đầu
        renderScripts(scriptsData);
