<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIN HUB - Đăng Nhập Key</title>
    <style>
        body { 
            background: #0b0f19; 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #131b2e; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
            border: 1px solid rgba(99, 102, 241, 0.3); 
            max-width: 400px; 
            width: 90%; 
        }
        h1 { 
            background: linear-gradient(45deg, #6366f1, #a855f7); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 5px; 
            font-size: 1.8rem;
        }
        p { 
            color: #9ca3af; 
            font-size: 0.85rem; 
            margin-bottom: 20px; 
            line-height: 1.4;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 10px; 
            background: #05070a; 
            border: 1px solid #1e293b; 
            color: white; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
            text-align: center; 
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #6366f1;
        }
        .btn { 
            background: #5865F2; 
            color: white; 
            padding: 12px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 12px; 
            transition: 0.3s; 
            border: none;
            width: 100%;
            cursor: pointer;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        .btn:hover { background: #4752c4; }
        .btn-key { background: #f59e0b; }
        .btn-key:hover { background: #d97706; }
        .btn-submit { 
            background: #10b981; 
            color: white; 
            border: none; 
            cursor: pointer; 
            width: 100%; 
            padding: 12px; 
            border-radius: 10px; 
            font-weight: bold; 
            transition: 0.3s; 
            font-size: 1rem;
        }
        .btn-submit:hover { background: #059669; }
        #message { margin-top: 15px; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>BIN HUB</h1>
        <p>Hệ thống xác thực key cá nhân 24h từ Bot Discord.</p>
        
        <!-- Nút lấy key đưa thẳng vào nhóm Discord -->
        <button type="button" class="btn btn-key" onclick="window.open('https://discord.gg/uqhEpzXy9q', '_blank')">🔑 Lấy Key Từ Bot Discord</button>
        
        <div style="margin: 15px 0; border-top: 1px solid #1e293b;"></div>

        <!-- Ô nhập key và nút đăng nhập -->
        <div id="verify-form">
            <input type="text" id="keyInput" placeholder="Dán key bot gửi vào đây..." autocomplete="off" required>
            <button type="button" class="btn-submit" onclick="verifyKey()">Đăng Nhập</button>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        async function verifyKey() {
            const userKey = document.getElementById('keyInput').value.trim();
            const msgDiv = document.getElementById('message');

            if (!userKey) {
                msgDiv.style.color = '#ef4444';
                msgDiv.innerText = 'Vui lòng dán key vào ô trống!';
                return;
            }

            msgDiv.style.color = '#9ca3af';
            msgDiv.innerText = 'Đang kiểm tra key...';

            try {
                // Đọc file danh sách key trực tiếp từ GitHub Pages của ní (thêm ?t= để chống cache trình duyệt)
                const response = await fetch('valid_keys.json?t=' + Date.now());
                if (!response.ok) {
                    throw new Error("Không thể tải dữ liệu key!");
                }
                
                const validKeys = await response.json();
                const now = Date.now();

                // Kiểm tra xem key có tồn tại và còn hạn sử dụng không
                if (validKeys[userKey] && validKeys[userKey] > now) {
                    msgDiv.style.color = '#10b981';
                    msgDiv.innerText = '🎉 Chính xác! Đang chuyển hướng vào kho script...';
                    
                    localStorage.setItem('binhub_auth', 'true');
                    
                    setTimeout(() => {
                        window.location.href = 'script.html'; // Tới trang kho script của ní
                    }, 1200);
                } else {
                    msgDiv.style.color = '#ef4444';
                    msgDiv.innerText = '❌ Key không đúng hoặc đã hết hạn (24h)!';
                }

            } catch (error) {
                console.error(error);
                msgDiv.style.color = '#ef4444';
                msgDiv.innerText = '⚠️ Lỗi hệ thống xác thực!';
            }
        }
    </script>
</body>
</html>
