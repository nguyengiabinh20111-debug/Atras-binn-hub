<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIN HUB - Premium Roblox Scripts</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a1c29 0%, #0b0f19 100%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: rgba(19, 27, 46, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .lock-screen p {
            color: #d1d5db;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-discord {
            background-color: #5865F2;
            color: white;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .btn-discord:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
        }

        .btn-support {
            background: #374151;
            color: white;
            margin-top: 5px;
        }

        .btn-support:hover {
            background: #4b5563;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>BIN HUB</h1>
            <p class="subtitle">Ultimate Roblox Script Hub</p>

            <!-- MÀN HÌNH KHÓA LIÊN KẾT ACL CLOUDS -->
            <div id="lockScreen" class="lock-screen">
                <div style="font-size: 3rem; margin-bottom: -10px;">🔒</div>
                <p>Hệ thống yêu cầu xác thực tài khoản Discord. Bạn bắt buộc phải ở trong Server mới được cấp mã Script!</p>
                
                <!-- Trỏ trực tiếp về IP/Port Node.js trên ACL Clouds của bạn -->
                <a href="http://141.11.237.69:30207" class="btn btn-discord">
                    🔑 Đăng Nhập & Xác Thực Discord
                </a>

                <a href="https://discord.gg/uqhEpzXy9q" target="_blank" class="btn btn-support">
                    🚀 Tham Gia Server Discord Ngay
                </a>
            </div>
        </div>
    </div>

</body>
</html>
