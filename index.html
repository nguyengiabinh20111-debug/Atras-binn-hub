<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIN HUB - Kho Script & Xác Thực Key</title>
    <style>
        body { 
            background: #0b0f19; 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: #131b2e; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
            border: 1px solid rgba(99, 102, 241, 0.3); 
            max-width: 450px; 
            width: 90%; 
        }
        h1 { 
            background: linear-gradient(45deg, #6366f1, #a855f7); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 10px; 
        }
        p { color: #9ca3af; font-size: 0.85rem; margin-bottom: 20px; }
        .btn { 
            background: #5865F2; color: white; padding: 12px 20px; border-radius: 10px; 
            text-decoration: none; font-weight: bold; display: block; margin-bottom: 15px; 
            transition: 0.3s; border: none; width: 100%; cursor: pointer; box-sizing: border-box; 
        }
        .btn:hover { background: #4752c4; }
        .btn-key { background: #f59e0b; }
        .btn-key:hover { background: #d97706; }
        input { 
            width: 100%; padding: 12px; border-radius: 10px; background: #05070a; 
            border: 1px solid #1e293b; color: white; margin-bottom: 15px; 
            box-sizing: border-box; text-align: center; font-size: 1rem; 
        }
        .btn-submit { background: #10b981; color: white; border: none; cursor: pointer; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .btn-submit:hover { background: #059669; }
        
        /* Giao diện kho script ẩn đi lúc đầu */
        #script-section { display: none; text-align: left; }
        .script-box { background: #05070a; padding: 15px; border-radius: 10px; border: 1px solid #1e293b; margin-bottom: 15px; }
        .script-title { font-weight: bold; color: #34d399; margin-bottom: 5px; }
        textarea { width: 100%; height: 70px; background: #131b2e; color: #fff; border: 1px solid #374151; border-radius: 6px; padding: 8px; font-family: monospace; resize: none; box-sizing: border-box; }
        .copy-btn { background: #6366f1; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; width: 100%; }
        .copy-btn:hover { background: #4f46e5; }
    </style>
</head>
<body>

    <div class="container" id="auth-container">
        <h1>BIN HUB SYSTEM</h1>
        <p>Vui lòng nhập Key hợp lệ để mở khóa kho Script!</p>
        
        <input type="text" id="key-input" placeholder="Nhập Key của bạn vào đây...">
        <button class="btn btn-key" onclick="window.open('https://discord.gg/uqhEpzXy9q', '_blank')">Lấy Key Từ Bot Discord</button>
        <button class="btn-submit" onclick="checkKey()">Xác Nhận Key</button>
        <p id="error-msg" style="color: #ef4444; margin-top: 10px; display: none;">Sai Key rồi bạn ơi!</p>
    </div>

    <div class="container" id="script-section">
        <h1>BIN HUB VIP</h1>
        <p>Mở khóa thành công! Dưới đây là các Script độc quyền:</p>
        
        <div class="script-box">
            <div class="script-title">⚡ Blox Fruits - Auto Farm</div>
            <textarea readonly>getgenv().team = "Pirates"
loadstring(game:HttpGet("https://raw.githubusercontent.com/Dev-BaconHub/hack/refs/heads/main/Bloxfruits.lua"))()</textarea>
            <button class="copy-btn" onclick="copyText(this)">Copy Script</button>
        </div>

        <div class="script-box">
            <div class="script-title">⚡ Solix Hub (Trộm Một Quả Trứng)</div>
            <textarea readonly>loadstring(game:HttpGet("https://raw.githubusercontent.com/Dev-BaconHub/hack/refs/heads/main/Solix.lua"))()</textarea>
            <button class="copy-btn" onclick="copyText(this)">Copy Script</button>
        </div>
        
        <button class="btn" style="background:#374151; margin-top:10px;" onclick="location.reload()">Khóa Lại (Đổi Key)</button>
    </div>

    <script>
        // Danh sách các Key hợp lệ (Bạn có thể thêm key tùy ý vào đây)
        const validKeys = ["BIN-VIP-2026", "BACON-HUB-FREE", "BINHUB123"];

        function checkKey() {
            const userKey = document.getElementById('key-input').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (validKeys.includes(userKey)) {
                // Ẩn bảng nhập key, hiện bảng script lên mượt mà không cần load lại trang
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('script-section').style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function copyText(button) {
            const textarea = button.previousElementSibling;
            textarea.select();
            document.execCommand('copy');
            button.innerText = "Đã Copy Thành Công! ✅";
            setTimeout(() => { button.innerText = "Copy Script"; }, 2000);
        }
    </script>
</body>
</html>
